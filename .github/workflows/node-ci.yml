# Reusable CI gate for fwd-stack projects. A project calls it from its own ci.yml:
#
#   jobs:
#     gate:
#       uses: HartiganHM/fwd-stack/.github/workflows/node-ci.yml@main
#       with:
#         scripts: typecheck lint test build
#         build-env: |
#           DATABASE_URL=postgres://stub:stub@localhost/stub
#
# Project-specific jobs (e2e, probes) stay in the project's own workflow beside this call. Each
# script runs through `pnpm run --if-present`, so a project without one skips it.
#
# Selected tests (opt-in): with `selected-test-script` set, pull requests and pushes run that script
# in place of `test`, with CI_BASE_REF naming the commit to compare against, and every other event
# (the caller's `schedule`, a `workflow_dispatch`) runs `test` in full. The README has the caller.
name: Node CI

on:
  workflow_call:
    inputs:
      scripts:
        description: Space-separated package.json scripts to run, in order.
        type: string
        default: typecheck lint test build
      working-directory:
        description: Directory holding the package.json and pnpm-lock.yaml to run against, relative to the repository root.
        type: string
        default: .
      node-version-file:
        description: File that pins the Node version, relative to working-directory.
        type: string
        default: .nvmrc
      build-env:
        description: KEY=VALUE lines exported before the scripts run (stub values only, never secrets).
        type: string
        default: ''
      timeout-minutes:
        type: number
        default: 20
      selected-test-script:
        description: >-
          Opt-in. A package.json script that runs only the tests a change needs. When set, a pull
          request or a push runs it in place of `test`, with CI_BASE_REF set to the commit to compare
          against; any other event, or a push with no usable base, runs `test` in full. Empty (the
          default) runs `test` on every event.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Selection compares against a base commit, so it needs the history; the default needs one.
          fetch-depth: ${{ inputs.selected-test-script != '' && '0' || '1' }}

      # `working-directory` reaches only `run` steps, so the setup actions are given the nested
      # project's files explicitly.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.working-directory }}/${{ inputs.node-version-file }}
          # Without this a major-only pin (`24`) resolves to whatever 24.x the runner has
          # cached, which can trail a security release.
          check-latest: true
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export build environment
        if: inputs.build-env != ''
        env:
          BUILD_ENV: ${{ inputs.build-env }}
        run: printf '%s\n' "$BUILD_ENV" | sed '/^[[:space:]]*$/d' >> "$GITHUB_ENV"

      - name: Run scripts
        env:
          SCRIPTS: ${{ inputs.scripts }}
          SELECTED: ${{ inputs.selected-test-script }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          for script in $SCRIPTS; do
            if [ "$script" = test ] && [ -n "$SELECTED" ]; then
              # A pull request compares against its base branch, a push against the commit before
              # it. A new branch or a forced push has no such commit here, so it runs in full, as
              # does every other event: the schedule and a dispatch are the full runs.
              base=""
              case "$EVENT" in
                pull_request) base="origin/$PR_BASE" ;;
                push) base="$PUSH_BEFORE" ;;
              esac
              if [ -n "$base" ] && git rev-parse --quiet --verify "$base^{commit}" >/dev/null; then
                echo "::group::pnpm run $SELECTED (selected tests against $base, $EVENT)"
                # No --if-present: a misspelt script must fail, not pass without running a test.
                CI_BASE_REF="$base" pnpm run "$SELECTED"
                echo "::endgroup::"
                continue
              fi
              echo "Full test suite: $EVENT${base:+, and $base is not a commit here}"
            fi
            echo "::group::pnpm run $script"
            pnpm run --if-present "$script"
            echo "::endgroup::"
          done
