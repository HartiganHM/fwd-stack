version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '06:00'
      timezone: America/Denver
    open-pull-requests-limit: 5
    groups:
      npm-non-major-updates:
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '06:00'
      timezone: America/Denver
    groups:
      actions:
        patterns: ['*']
